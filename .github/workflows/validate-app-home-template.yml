name: Validate App Home template

on:
  pull_request:
    branches:
      - main
    paths:
      - "app-home/**"
      - ".github/scripts/app-home-template.test.mjs"
      - ".github/workflows/validate-app-home-template.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/app-home-template.test.mjs
